name: flutter_lms
description: Flutter LMS Mobile Application
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Existing UI dependencies
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1

  # Phase 2 — backend integration foundation
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  provider: ^6.1.2
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  mime: ^1.0.6
  http_parser: ^4.0.2

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true